<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball Battle</title>
<style>
:root{--bg:#e8ecf4;--fg:#161a2b;--pn:#fafbff;--ln:#b9c1d9;--ac:#ff3d7f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--fg:#eceefb;--pn:#1c2033;--ln:#363c5c}}
:root[data-theme="dark"]{--bg:#12141f;--fg:#eceefb;--pn:#1c2033;--ln:#363c5c}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans Thai',Sarabun,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:min(100%,50vw);aspect-ratio:2/1}
canvas{width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:var(--bg)}
.hide{display:none!important}
h1{margin:0;font-size:clamp(30px,13vh,72px);letter-spacing:-.02em}
h2{margin:0;font-size:clamp(22px,8vh,40px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.6vw}
.row{display:flex;align-items:center;gap:1.2vw;font-size:clamp(14px,4.5vh,24px)}
.row span{min-width:7em}
button{font:inherit;font-size:clamp(14px,4.5vh,24px);padding:.45em 1.1em;border-radius:12px;border:2px solid var(--ln);background:var(--pn);color:var(--fg);cursor:pointer}
button:disabled{opacity:.45}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#ml{display:flex;flex-direction:column;gap:6px;max-height:40%;overflow:auto;width:min(86%,540px);touch-action:pan-y}
.mod{display:flex;align-items:center;gap:8px;background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:5px 10px;font-size:clamp(12px,3.6vh,17px)}
.mod>div{flex:1}.mod small{display:block;opacity:.7}.mod button{font-size:inherit;padding:.15em .7em}
#pk{position:absolute;inset:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 1.5% 2%;pointer-events:none}
.pp{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:47%;background:color-mix(in srgb,var(--bg) 85%,transparent);border:3px solid var(--ln);border-radius:14px;padding:6px 8px;font-size:clamp(12px,3.4vh,16px)}
.pp b{flex:0 0 100%}.pp button{font-size:inherit;padding:.25em .6em}
#bar{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);display:flex;gap:8px}
#bar button{font-size:clamp(12px,3.6vh,18px);padding:.25em .8em}
#rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:var(--bg);text-align:center;font-size:20px;padding:24px}
@media (orientation:portrait){#rot{display:flex}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="menu" class="ov">
 <h1 data-t="title"></h1>
 <div class="grid">
  <button data-t="vsbot" onclick="start('bot')"></button>
  <button data-t="two" onclick="start('two')"></button>
  <button data-t="bots" onclick="start('bots')"></button>
  <button data-t="online" disabled></button>
  <button data-t="settings" onclick="show('set')"></button><button data-t="mods" onclick="openMods()"></button>
 </div>
</div>
<div id="set" class="ov hide">
 <h2 data-t="settings"></h2>
 <div class="row"><span data-t="lang"></span><button id="lth" onclick="setL('th')">ไทย</button><button id="len" onclick="setL('en')">English</button></div>
 <div class="row"><span data-t="sound"></span><button id="snd" onclick="cfg.snd^=1;save();apply()"></button></div>
 <div class="row"><span data-t="diff"></span><button id="d0" data-t="d0" onclick="setD(0)"></button><button id="d1" data-t="d1" onclick="setD(1)"></button><button id="d2" data-t="d2" onclick="setD(2)"></button></div>
 <button data-t="back" onclick="show('menu')"></button>
</div>
<div id="mods" class="ov hide">
 <h2 data-t="mods"></h2>
 <div id="ml"></div>
 <div class="row"><button data-t="imp" onclick="$('#mf').click()"></button><button id="mus" onclick="mus=!mus;music()"></button><button data-t="back" onclick="show('menu')"></button></div>
 <input id="mf" type="file" style="display:none" onchange="impMod(this.files[0]);this.value=''">
 <div id="mm" style="font-size:clamp(11px,3.2vh,15px)"></div>
</div>
<div id="pk"></div>
<div id="res" class="ov hide" style="background:color-mix(in srgb,var(--bg) 88%,transparent)">
 <h2 id="rt"></h2>
 <div class="grid"><button data-t="again" onclick="start(mode)"></button><button data-t="menu" onclick="show('menu')"></button></div>
</div>
<div id="bar" class="hide"><button id="spd" onclick="spd=spd==1?2:spd==2?4:1;this.textContent='x'+spd">x1</button><button data-t="menu" onclick="show('menu')"></button></div>
</div>
<div id="rot"><p data-t="rot"></p></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),W=800,H=400;
cv.width=W;cv.height=H;
let cfg={lang:'th',snd:1,diff:1};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('bb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bb',JSON.stringify(cfg))}catch(e){}};
const TX={
en:{title:'Ball Battle',vsbot:'Vs Bot',two:'2 Players',bots:'Bot vs Bot',online:'Online (soon)',settings:'Settings',lang:'Language',sound:'Sound',diff:'Bot level',d0:'Easy',d1:'Normal',d2:'Hard',on:'On',off:'Off',back:'Back',again:'Play again',menu:'Menu',win:'wins!',mods:'Mods',imp:'Import .bb',mon:'Music: on',moff:'Music: off',bad:'Invalid mod file',by:'by',rr:'Reroll',aim:'Drag to aim',rdy:'Ready',p1:'Player 1',p2:'Player 2',bot:'Bot',rot:'Rotate your phone to landscape',
sk:{dash:'Dash',wave:'Shockwave',heavy:'Heavy',shield:'Shield',giant:'Giant',magnet:'Magnet',swap:'Swap',bolt:'Lightning'}},
th:{title:'บอลบัตเทิล',vsbot:'สู้กับบอท',two:'2 ผู้เล่น',bots:'บอทสู้บอท',online:'ออนไลน์ (เร็วๆ นี้)',settings:'ตั้งค่า',lang:'ภาษา',sound:'เสียง',diff:'ระดับบอท',d0:'ง่าย',d1:'กลาง',d2:'ยาก',on:'เปิด',off:'ปิด',back:'กลับ',again:'เล่นอีกครั้ง',menu:'เมนู',win:'ชนะ!',mods:'ม็อด',imp:'นำเข้า .bb',mon:'เพลง: เปิด',moff:'เพลง: ปิด',bad:'ไฟล์ม็อดไม่ถูกต้อง',by:'โดย',rr:'สุ่มใหม่',aim:'ลากเพื่อเล็ง',rdy:'พร้อม',p1:'ผู้เล่น 1',p2:'ผู้เล่น 2',bot:'บอท',rot:'หมุนโทรศัพท์เป็นแนวนอน',
sk:{dash:'พุ่งชน',wave:'คลื่นกระแทก',heavy:'หนักอึ้ง',shield:'โล่',giant:'ยักษ์',magnet:'แม่เหล็ก',swap:'สลับที่',bolt:'สายฟ้า'}}};
const T=()=>TX[cfg.lang];
function apply(){document.documentElement.lang=cfg.lang;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T()[e.dataset.t]);
 $('#snd').textContent=T()[cfg.snd?'on':'off'];$('#snd').classList.toggle('on',!!cfg.snd);
 $('#lth').classList.toggle('on',cfg.lang=='th');$('#len').classList.toggle('on',cfg.lang=='en');
 for(let i=0;i<3;i++)$('#d'+i).classList.toggle('on',cfg.diff==i)}
const setL=l=>{cfg.lang=l;save();apply()},setD=d=>{cfg.diff=d;save();apply()};
function show(id){run=false;['menu','set','res','mods'].forEach(k=>$('#'+k).classList.toggle('hide',k!=id));if(id!='mods')stopMus();$('#pk').style.display='none';$('#bar').classList.add('hide')}

let ac;function beep(f){if(!cfg.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime;o.frequency.value=f;v.gain.setValueAtTime(.05,n);v.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(v);v.connect(ac.destination);o.start();o.stop(n+.12)}catch(e){}}

const ax=10,ay=50,aw=W-20,ah=H-60,R0=28,SK=['dash','wave','heavy','shield','giant','magnet','swap','bolt'];
let mode,B=[],fx=[],run=false,spd=1,C={},stick={},keys={};
let COL=['#3d7bff','#ff3d7f'];
function mk(i,bot){const hp=100+(Math.random()*151|0);return{i,bot,x:i?W-180:180,y:ay+ah/2,vx:0,vy:0,r:R0,m:1,hp,mx:hp,sk:pickSk(),cd:0,heavy:0,giant:0,shield:0,magnet:0,frz:0,hit:0,dx:0,dy:0,mag:0,ait:0}}
function start(m){mode=m;const cs=getComputedStyle(document.documentElement);
 C={fg:cs.getPropertyValue('--fg').trim(),pn:cs.getPropertyValue('--pn').trim(),ln:cs.getPropertyValue('--ln').trim(),bg:cs.getPropertyValue('--bg').trim()};
 B=[mk(0,m=='bots'),mk(1,m!='two')];fx=[];stick={};spd=1;ph=m=='bots'?'fight':'pick';PK=[0,1].map(()=>({o:[mkO(),mkO(),mkO()],c:-1,rr:false,aim:null,rd:false}));if(m=='bot'){const q=PK[1],k=Math.random()*3|0,o=q.o[k];q.c=k;q.rr=q.rd=true;B[1].hp=B[1].mx=o.hp;B[1].sk=o.sk;q.aim=Math.PI+(Math.random()-.5)*.8}if(m=='bots'){B[0].vx=420;B[1].vx=-420}else renderPk();$('#spd').textContent='x1';$('#spd').style.display=m=='bots'?'':'none';
 ['menu','set','res'].forEach(k=>$('#'+k).classList.add('hide'));$('#bar').classList.remove('hide');run=true}
const nm=i=>i?(mode=='two'?T().p2:T().bot+(mode=='bots'?' 2':'')):(mode=='bots'?T().bot+' 1':T().p1);

function ring(s,c){fx.push({x:s.x,y:s.y,t:0,c})}
function use(s,o){if(!run||s.cd>0)return;const K=SKD[s.sk],P=K?K.power||1:1;s.cd=K?K.cd||6:6;beep(600);
 const d=Math.hypot(o.x-s.x,o.y-s.y)||1,ux=(o.x-s.x)/d,uy=(o.y-s.y)/d;
 switch(K?K.base:s.sk){
  case'dash':{const x=ux,y=uy;s.vx+=x*750*P;s.vy+=y*750*P;break}
  case'wave':if(d<240){o.vx+=ux*700*P/o.m;o.vy+=uy*700*P/o.m}ring(s,'#ffd23f');break;
  case'heavy':s.heavy=3.5;break;
  case'shield':s.shield=5;break;
  case'giant':s.giant=4;break;
  case'magnet':s.magnet=2.5;break;
  case'swap':[s.x,o.x]=[o.x,s.x];[s.y,o.y]=[o.y,s.y];ring(s,'#b66dff');ring(o,'#b66dff');break;
  case'bolt':o.frz=1.3;o.vx*=.2;o.vy*=.2;ring(o,'#ffd23f')}}
function dmg(s,v){if(s.hit>0)return;if(s.shield>0){s.shield=0;ring(s,'#fff');return}s.hp-=v;s.hit=.2}

const KM=[[['a','arrowleft'],['d','arrowright'],['w','arrowup'],['s','arrowdown']],[['arrowleft'],['arrowright'],['arrowup'],['arrowdown']]];
const kd=(i,j)=>KM[i][j].some((k,n)=>keys[k]&&(i||n==0||mode=='bot'))?1:0;
function readIn(s){const st=stick[s.i];let x=0,y=0,m=0;
 if(st){const dx=st.x-st.sx,dy=st.y-st.sy,l=Math.hypot(dx,dy);if(l>8){x=dx/l;y=dy/l;m=Math.min(l,60)/60}}
 else{x=kd(s.i,1)-kd(s.i,0);y=kd(s.i,3)-kd(s.i,2);if(x||y){const l=Math.hypot(x,y);x/=l;y/=l;m=1}}
 s.dx=x;s.dy=y;s.mag=m}

function upd(dt){const[a,b]=B;
 for(const s of B){const o=s==a?b:a,df=cfg.diff;
  if(s.bot){s.ait-=dt;
   if(s.ait<=0){s.ait=[.5,.3,.15][df];const an=Math.atan2(o.y-s.y,o.x-s.x)+(Math.random()-.5)*[1.6,.8,.2][df];s.dx=Math.cos(an);s.dy=Math.sin(an);s.mag=[.65,.85,1][df]}
   if(s.cd<=0&&Math.hypot(o.x-s.x,o.y-s.y)<300&&Math.random()<[.01,.03,.08][df])use(s,o)}
  else if(s.cd<=0&&Math.hypot(o.x-s.x,o.y-s.y)<300)use(s,o);
  for(const k of['heavy','giant','shield','magnet','frz','hit','cd'])s[k]=Math.max(0,s[k]-dt);
  if(s==a){a.rg=(a.rg||0)+dt;if(a.rg>=5){a.rg-=5;const h=[a.hp,b.hp];B.forEach((t,i)=>{t.hp=Math.min(t.mx,t.hp+(h[i]<h[1-i]?28:8)+(Math.random()*5|0))})}}
  s.r=R0*(s.giant>0?1.6:1);s.m=(s.heavy>0?3:1)*(s.giant>0?2.5:1);
  
  if(s.magnet>0){const d=Math.max(1,Math.hypot(s.x-o.x,s.y-o.y));o.vx+=(s.x-o.x)/d*700*dt;o.vy+=(s.y-o.y)/d*700*dt}}
 for(const s of B){const f=Math.exp(-.12*dt),sp=Math.hypot(s.vx,s.vy);s.vx*=f;s.vy*=f;if(sp>650){s.vx*=650/sp;s.vy*=650/sp}if(sp<230&&sp>1&&s.frz<=0){s.vx*=230/sp;s.vy*=230/sp}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(s.x-s.r<ax){s.x=ax+s.r;s.vx=Math.abs(s.vx)*.9}if(s.x+s.r>ax+aw){s.x=ax+aw-s.r;s.vx=-Math.abs(s.vx)*.9}
  if(s.y-s.r<ay){s.y=ay+s.r;s.vy=Math.abs(s.vy)*.9}if(s.y+s.r>ay+ah){s.y=ay+ah-s.r;s.vy=-Math.abs(s.vy)*.9}}
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mn=a.r+b.r;
 if(d<mn){const nx=dx/d,ny=dy/d,ov=mn-d,t=a.m+b.m;
  a.x-=nx*ov*b.m/t;a.y-=ny*ov*b.m/t;b.x+=nx*ov*a.m/t;b.y+=ny*ov*a.m/t;
  const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rv<0){const j=-1.2*rv/(1/a.m+1/b.m);a.vx-=j/a.m*nx;a.vy-=j/a.m*ny;b.vx+=j/b.m*nx;b.vy+=j/b.m*ny;
   const sp=-rv;if(sp>80){dmg(a,(sp-80)*.045*b.m);dmg(b,(sp-80)*.045*a.m);beep(120+sp/3)}}}
 fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.4);
 if(a.hp<=0||b.hp<=0){const w=a.hp>b.hp?a:b;show('res');$('#rt').textContent=nm(w.i)+' '+T().win}}

const FN=" 'Noto Sans Thai',Sarabun,system-ui,sans-serif";
function draw(){g.fillStyle=C.bg||'#12141f';g.fillRect(0,0,W,H);
 g.fillStyle=C.pn||'#1c2033';g.strokeStyle=C.ln||'#363c5c';g.lineWidth=4;g.beginPath();g.roundRect(ax,ay,aw,ah,18);g.fill();g.stroke();
 if(!B.length)return;
 for(const f of fx){g.strokeStyle=f.c;g.globalAlpha=1-f.t/.4;g.lineWidth=5;g.beginPath();g.arc(f.x,f.y,f.t*550,0,7);g.stroke()}g.globalAlpha=1;
 for(const s of B){
  g.fillStyle=COL[s.i];g.globalAlpha=s.frz>0?.5:1;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();g.globalAlpha=1;
  if(s.hit>0){g.fillStyle='rgba(255,255,255,.55)';g.fill()}
  g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.arc(s.x-s.r*.3,s.y-s.r*.3,s.r*.3,0,7);g.fill();
  if(s.shield>0){g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.arc(s.x,s.y,s.r+6,0,7);g.stroke()}
  if(s.heavy>0){g.strokeStyle=C.fg;g.lineWidth=6;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.stroke()}
  if(s.magnet>0){g.strokeStyle='#b66dff';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.arc(s.x,s.y,s.r+12,0,7);g.stroke();g.setLineDash([])}
  if(ph!='fight')continue;const bx=s.i?W-340:10;
  g.fillStyle=C.ln;g.fillRect(bx,10,330,16);g.fillStyle=COL[s.i];g.fillRect(bx,10,330*Math.max(0,s.hp/s.mx),16);
  g.fillStyle=C.fg;g.font='700 13px'+FN;g.textAlign=s.i?'right':'left';
  g.fillText(nm(s.i)+'  '+Math.max(0,Math.ceil(s.hp)),s.i?bx+330:bx,43);
  g.textAlign=s.i?'left':'right';g.font='12px'+FN;g.fillText(skn(s.sk),s.i?bx:bx+330,43)}
 g.textAlign='center';
 for(const i of[0,1]){if(mode=='bots'||(i&&mode!='two'))continue;continue;const s=B[i],x=i?740:60,y=340;
  g.fillStyle=C.pn;g.globalAlpha=.92;g.beginPath();g.arc(x,y,38,0,7);g.fill();g.globalAlpha=1;
  if(s.cd>0){g.fillStyle=COL[i];g.globalAlpha=.35;g.beginPath();g.moveTo(x,y);g.arc(x,y,38,-1.57,-1.57+6.283*Math.min(1,s.cd/6));g.fill();g.globalAlpha=1}
  g.strokeStyle=COL[i];g.lineWidth=4;g.beginPath();g.arc(x,y,38,0,7);g.stroke();
  g.fillStyle=C.fg;g.font='700 12px'+FN;g.fillText(skn(s.sk),x,y+4)}
 for(const k in stick){const st=stick[k],dx=st.x-st.sx,dy=st.y-st.sy,l=Math.min(60,Math.hypot(dx,dy)),an=Math.atan2(dy,dx);
  g.strokeStyle=C.ln;g.lineWidth=3;g.beginPath();g.arc(st.sx,st.sy,60,0,7);g.stroke();
  g.fillStyle=COL[k];g.globalAlpha=.7;g.beginPath();g.arc(st.sx+Math.cos(an)*l,st.sy+Math.sin(an)*l,22,0,7);g.fill();g.globalAlpha=1}}

const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{if(!run)return;const[x,y]=pt(e);if(ph!='fight'){const p=mode=='two'?(x<W/2?0:1):mode=='bot'?0:-1;if(p>=0&&PK[p]&&PK[p].c>=0&&!PK[p].rd){PK[p].aim=Math.atan2(y-B[p].y,x-B[p].x);drag=p;try{cv.setPointerCapture(e.pointerId)}catch(_){}}}return;
 for(const i of[0,1]){if(mode=='bots'||(i&&mode!='two'))continue;if(Math.hypot(x-(i?740:60),y-340)<48){use(B[i],B[1-i]);return}}
 const p=mode=='two'?(x<W/2?0:1):mode=='bot'?0:-1;if(p<0||stick[p])return;
 stick[p]={id:e.pointerId,sx:x,sy:y,x,y};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(ph!='fight'){if(drag>=0&&PK[drag])PK[drag].aim=Math.atan2(y-B[drag].y,x-B[drag].x);return}for(const k in stick)if(stick[k].id==e.pointerId){stick[k].x=x;stick[k].y=y}});
const rel=e=>{drag=-1;for(const k in stick)if(stick[k].id==e.pointerId)delete stick[k]};
cv.addEventListener('pointerup',rel);cv.addEventListener('pointercancel',rel);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(k.startsWith('arrow')||k==' ')e.preventDefault();
 
 });
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});

let last=0;
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(run&&ph=='fight')for(let k=0;k<spd;k++)if(run)upd(dt);draw();drawAim();requestAnimationFrame(loop)}

// ---- mods ----
const BUILTIN=[
 {id:'ex-skills',name:'Example Skills',ver:'1.0',author:'Ball Battle',desc:'Mega Dash + Mini Wave',skills:[{id:'megadash',name:{en:'Mega Dash',th:'พุ่งสุดแรง'},base:'dash',power:1.6,cd:8},{id:'minwave',name:{en:'Mini Wave',th:'คลื่นเล็ก'},base:'wave',power:.6,cd:3}]},
 {id:'ex-theme',name:'Neon Theme',ver:'1.0',author:'Ball Battle',desc:'Neon colors',theme:{p1:'#00e5ff',p2:'#ff2bd6',ac:'#ff2bd6'}}];
const BASES=['dash','wave','heavy','shield','giant','magnet','swap','bolt'];
let mods=[],SKD={},mus=true,mt=null,mi=0;
function loadMods(){let st={};try{st=JSON.parse(localStorage.getItem('bbm')||'{}')}catch(e){}
