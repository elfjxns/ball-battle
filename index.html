<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ball Battle</title>
<style>
:root{--bg:#e8ecf4;--fg:#161a2b;--pn:#fafbff;--ln:#b9c1d9;--ac:#ff3d7f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--fg:#eceefb;--pn:#1c2033;--ln:#363c5c}}
:root[data-theme="dark"]{--bg:#12141f;--fg:#eceefb;--pn:#1c2033;--ln:#363c5c}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans Thai',Sarabun,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:min(100%,50vw);aspect-ratio:2/1}
canvas{width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:var(--bg)}
.hide{display:none!important}
h1{margin:0;font-size:clamp(28px,11vh,64px);letter-spacing:-.02em}
h2{margin:0;font-size:clamp(20px,7vh,36px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.4vw}
.row{display:flex;align-items:center;gap:1.2vw;font-size:clamp(14px,4.5vh,24px)}
.row span{min-width:7em}
button{font:inherit;font-size:clamp(13px,4vh,22px);padding:.4em 1em;border-radius:12px;border:2px solid var(--ln);background:var(--pn);color:var(--fg);cursor:pointer}
button:disabled{opacity:.45}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
#ml,#sl{display:flex;flex-direction:column;gap:6px;max-height:35%;overflow:auto;width:min(88%,560px);touch-action:pan-y}
.mod,.shop-item{display:flex;align-items:center;gap:8px;background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:6px 12px;font-size:clamp(12px,3.5vh,16px)}
.mod>div,.shop-item>div{flex:1}.mod small,.shop-item small{display:block;opacity:.7}.mod button,.shop-item button{font-size:inherit;padding:.2em .8em}
#pk{position:absolute;inset:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 1.5% 2%;pointer-events:none}
.pp{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:47%;background:color-mix(in srgb,var(--bg) 85%,transparent);border:3px solid var(--ln);border-radius:14px;padding:6px 8px;font-size:clamp(12px,3.4vh,16px)}
.pp b{flex:0 0 100%}.pp button{font-size:inherit;padding:.25em .6em}
#bar{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);display:flex;gap:8px}
#bar button{font-size:clamp(12px,3.6vh,18px);padding:.25em .8em}
#rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:var(--bg);text-align:center;font-size:20px;padding:24px}
.coin-disp{font-size:clamp(14px,4.5vh,22px);font-weight:700;color:#ffd700;background:rgba(0,0,0,0.2);padding:4px 12px;border-radius:20px;border:1px solid #ffd700}
.redeem-box{display:flex;gap:8px;margin-bottom:10px;width:min(88%,560px)}
.redeem-box input{flex:1;font:inherit;padding:.4em .8em;border-radius:10px;border:2px solid var(--ln);background:var(--pn);color:var(--fg)}
@media (orientation:portrait){#rot{display:flex}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="menu" class="ov">
 <h1 data-t="title"></h1>
 <div class="coin-disp">🪙 <span id="mcoins">0</span></div>
 <div class="grid">
  <button data-t="vsbot" onclick="start('bot')"></button>
  <button data-t="multi" onclick="show('pselect')"></button>
  <button data-t="bots" onclick="start('bots')"></button>
  <button data-t="online" onclick="startOnline()"></button>
  <button data-t="shop" onclick="show('shop')"></button>
  <button data-t="settings" onclick="show('set')"></button>
  <button data-t="mods" onclick="openMods()"></button>
 </div>
</div>
<div id="pselect" class="ov hide">
 <h2 data-t="selectP"></h2>
 <div class="row" style="gap:15px">
  <button onclick="startMulti(2)">2 Players (2P)</button>
  <button onclick="startMulti(3)">3 Players (3P)</button>
  <button onclick="startMulti(4)">4 Players (4P)</button>
 </div>
 <button data-t="back" onclick="show('menu')"></button>
</div>
<div id="shop" class="ov hide">
 <h2 data-t="shop"></h2>
 <div class="coin-disp">🪙 <span id="scoins">0</span></div>
 <div class="redeem-box">
  <input type="text" id="rcode" placeholder="Enter Code (e.g. CLOCK UP)">
  <button data-t="redeem" onclick="redeemCode()">แลก</button>
 </div>
 <div id="rmsg" style="font-size:13px;color:#ff3d7f;min-height:1.2em"></div>
 <div id="sl"></div>
 <button data-t="back" onclick="show('menu')"></button>
</div>
<div id="online-match" class="ov hide">
 <h2 data-t="online"></h2>
 <p id="match-status" style="font-size:clamp(16px,5vh,24px)">กำลังค้นหาผู้เล่น...</p>
 <button data-t="back" onclick="show('menu')">ยกเลิก</button>
</div>
<div id="set" class="ov hide">
 <h2 data-t="settings"></h2>
 <div class="row"><span data-t="lang"></span><button id="lth" onclick="setL('th')">ไทย</button><button id="len" onclick="setL('en')">English</button></div>
 <div class="row"><span data-t="sound"></span><button id="snd" onclick="cfg.snd^=1;save();apply()"></button></div>
 <div class="row"><span data-t="diff"></span><button id="d0" data-t="d0" onclick="setD(0)"></button><button id="d1" data-t="d1" onclick="setD(1)"></button><button id="d2" data-t="d2" onclick="setD(2)"></button></div>
 <button data-t="back" onclick="show('menu')"></button>
</div>
<div id="mods" class="ov hide">
 <h2 data-t="mods"></h2>
 <div id="ml"></div>
 <div id="modguide" style="font-size:clamp(11px,3vh,14px);opacity:.85;max-width:90%;text-align:center;background:var(--pn);border:2px solid var(--ln);border-radius:8px;padding:6px;">
  <b>📖 คู่มือสร้างม็อด:</b> สร้างไฟล์ .zip ที่มี `mod.json` และโฟลเดอร์ `skills/` (พลังสกิล 1-30, คูลดาวน์ 50-270s ตามความแรง)
 </div>
 <div class="row"><button data-t="imp" onclick="$('#mf').click()"></button><button id="mus" onclick="mus=!mus;music()"></button><button data-t="back" onclick="show('menu')"></button></div>
 <input id="mf" type="file" style="display:none" onchange="impMod(this.files[0]);this.value=''">
 <div id="mm" style="font-size:clamp(11px,3.2vh,15px)"></div>
</div>
<div id="pk"></div>
<div id="res" class="ov hide" style="background:color-mix(in srgb,var(--bg) 88%,transparent)">
 <h2 id="rt"></h2>
 <div id="rew" style="font-size:clamp(14px,4vh,22px);color:#ffd700;font-weight:bold;"></div>
 <div class="grid"><button data-t="again" onclick="start(mode)"></button><button data-t="menu" onclick="show('menu')"></button></div>
</div>
<div id="bar" class="hide">
 <button id="spd" onclick="spd=spd==1?2:spd==2?4:1;this.textContent='x'+spd">x1</button>
 <button id="paus" onclick="togglePause()">⏸️</button>
 <button data-t="menu" onclick="show('menu')"></button>
</div>
</div>
<div id="rot"><p data-t="rot"></p></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),W=800,H=400;
cv.width=W;cv.height=H;
let cfg={lang:'th',snd:1,diff:1,coins:0,eqSkin:'default',eqColor:'default',eqFx:'default',inv:['skin_default','color_default','fx_default'],usedCodes:[],unlockedSkills:[]};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('bb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bb',JSON.stringify(cfg))}catch(e){}};
const TX={
en:{title:'Ball Battle',vsbot:'Vs Bot',multi:'Multiplayer',selectP:'Select Players',bots:'Bot vs Bot',online:'Online Match',settings:'Settings',lang:'Language',sound:'Sound',diff:'Bot level',d0:'Easy',d1:'Normal',d2:'Hard',on:'On',off:'Off',back:'Back',again:'Play again',menu:'Menu',win:'wins!',mods:'Mods',imp:'Import .bb',mon:'Music: on',moff:'Music: off',bad:'Invalid mod file',by:'by',rr:'Reroll',aim:'Drag to aim',rdy:'Ready',p1:'Player 1',p2:'Player 2',p3:'Player 3',p4:'Player 4',bot:'Bot',rot:'Rotate your phone to landscape',pause:'Pause',resume:'Resume',shop:'Shop',buy:'Buy',equip:'Equip',equipped:'Equipped',redeem:'Redeem',matchFound:'Opponent Found! Starting...',invalidCode:'Invalid or used code',successCode:'Redeemed successfully! +',unlockedSkill:'Unlocked Skill: Clock Up!',
sk:{dash:'Dash',wave:'Shockwave',heavy:'Heavy',shield:'Shield',giant:'Giant',magnet:'Magnet',swap:'Swap',bolt:'Lightning',clockup:'Clock Up'}},
th:{title:'บอลบัตเทิล',vsbot:'สู้กับบอท',multi:'หลายผู้เล่น (2-4P)',selectP:'เลือกจำนวนผู้เล่น',bots:'บอทสู้บอท',online:'ออนไลน์ (จับคู่)',settings:'ตั้งค่า',lang:'ภาษา',sound:'เสียง',diff:'ระดับบอท',d0:'ง่าย',d1:'กลาง',d2:'ยาก',on:'เปิด',off:'ปิด',back:'กลับ',again:'เล่นอีกครั้ง',menu:'เมนู',win:'ชนะ!',mods:'ม็อด',imp:'นำเข้า .bb',mon:'เพลง: เปิด',moff:'เพลง: ปิด',bad:'ไฟล์ม็อดไม่ถูกต้อง',by:'โดย',rr:'สุ่มใหม่',aim:'ลากเพื่อเล็ง',rdy:'พร้อม',p1:'ผู้เล่น 1',p2:'ผู้เล่น 2',p3:'ผู้เล่น 3',p4:'ผู้เล่น 4',bot:'บอท',rot:'หมุนโทรศัพท์เป็นแนวนอน',pause:'พักเกม',resume:'เล่นต่อ',shop:'ร้านค้า',buy:'ซื้อ',equip:'ใช้งาน',equipped:'ใช้อยู่',redeem:'แลกโค้ด',matchFound:'เจอคู่ต่อสู้แล้ว! กำลังเริ่มเกม...',invalidCode:'โค้ดไม่ถูกต้องหรือถูกใช้ไปแล้ว',successCode:'แลกสำเร็จ! +',unlockedSkill:'ปลดล็อกสกิล: Clock Up!',
sk:{dash:'พุ่งชน',wave:'คลื่นกระแทก',heavy:'หนักอึ้ง',shield:'โล่',giant:'ยักษ์',magnet:'แม่เหล็ก',swap:'สลับที่',bolt:'สายฟ้า',clockup:'นาฬิกาเร่งเวลา'}}};
const T=()=>TX[cfg.lang];
function apply(){document.documentElement.lang=cfg.lang;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T()[e.dataset.t]);
 $('#snd').textContent=T()[cfg.snd?'on':'off'];$('#snd').classList.toggle('on',!!cfg.snd);
 $('#lth').classList.toggle('on',cfg.lang=='th');$('#len').classList.toggle('on',cfg.lang=='en');
 for(let i=0;i<3;i++)$('#d'+i).classList.toggle('on',cfg.diff==i);
 $('#mcoins').textContent=cfg.coins||0;
 $('#scoins').textContent=cfg.coins||0;}
const setL=l=>{cfg.lang=l;save();apply()},setD=d=>{cfg.diff=d;save();apply()};
function show(id){run=false;['menu','set','res','mods','shop','online-match','pselect'].forEach(k=>$('#'+k).classList.toggle('hide',k!=id));if(id!='mods')stopMus();if(id=='shop')renderShop();$('#pk').style.display='none';$('#bar').classList.add('hide');apply();}

const CODES={ 'FREECOINS':100, 'BALLBATTLE':250, 'PROGAMER':500, 'CLOCK UP':'skill_clockup' };

function redeemCode(){
 const rawCode=$('#rcode').value.trim();
 const code=rawCode.toUpperCase();
 const msg=$('#rmsg');
 if(!code){return;}
 if(CODES[code] && !cfg.usedCodes.includes(code)){
  const val=CODES[code];
  cfg.usedCodes.push(code);
  if(typeof val === 'number'){
   cfg.coins=(cfg.coins||0)+val;
   msg.style.color='#2ecc71';
   msg.textContent=T().successCode+val+' Coins!';
  } else if(val === 'skill_clockup'){
   if(!cfg.unlockedSkills) cfg.unlockedSkills=[];
   if(!cfg.unlockedSkills.includes('clockup')) cfg.unlockedSkills.push('clockup');
   msg.style.color='#2ecc71';
   msg.textContent=T().unlockedSkill;
  }
  save();apply();
  $('#rcode').value='';
 } else {
  msg.style.color='#ff3d7f';
  msg.textContent=T().invalidCode;
 }
}

function startOnline(){
 show('online-match');
 $('#match-status').textContent=cfg.lang=='th'?'กำลังค้นหาคู่ต่อสู้...':'Searching for opponent...';
 setTimeout(()=>{
  if($('#online-match').classList.contains('hide'))return;
  $('#match-status').textContent=T().matchFound;
  setTimeout(()=>{start('bot');},1000);
 },2500);
}

const SHOP_ITEMS=[
 {id:'skin_default',cat:'skin',name:{th:'สกินเริ่มต้น',en:'Default Skin'},cost:0},
 {id:'skin_fire',cat:'skin',name:{th:'สกินไฟ Neon Flame',en:'Neon Flame Skin'},cost:50},
 {id:'skin_elec',cat:'skin',name:{th:'สกินสายฟ้า Electric',en:'Electric Blue Skin'},cost:80},
 {id:'color_default',cat:'color',name:{th:'สีคลาสสิก (ฟ้า/ชมพู)',en:'Classic (Blue/Pink)'},cost:0},
 {id:'color_gold',cat:'color',name:{th:'สีทอง/เขียว',en:'Gold & Green'},cost:40},
 {id:'color_purple',cat:'color',name:{th:'สีม่วง/ส้ม',en:'Purple & Orange'},cost:40},
 {id:'fx_default',cat:'fx',name:{th:'เอฟเฟกต์การตาย: ปกติ',en:'Death Fx: Normal'},cost:0},
 {id:'fx_star',cat:'fx',name:{th:'เอฟเฟกต์การตาย: ละอองดาว',en:'Death Fx: Starburst'},cost:60}
];

function renderShop(){
 const l=$('#sl');l.textContent='';$('#rmsg').textContent='';
 SHOP_ITEMS.forEach(item=>{
  const d=document.createElement('div');d.className='shop-item';
  const info=document.createElement('div');
  const itemName = item.name[cfg.lang] || item.name.en;
  info.innerHTML = `<b>${itemName}</b><small>${item.cost > 0 ? '🪙 ' + item.cost : 'ฟรี'}</small>`;
  d.appendChild(info);
  
  const b=document.createElement('button');
  const hasItem = cfg.inv.includes(item.id);
  const isEquipped = (item.cat=='skin' && cfg.eqSkin==item.id)||(item.cat=='color' && cfg.eqColor==item.id)||(item.cat=='fx' && cfg.eqFx==item.id);

  if(isEquipped){
   b.textContent = T().equipped; b.className = 'on'; b.disabled = true;
  } else if(hasItem){
   b.textContent = T().equip;
   b.onclick = ()=>{
    if(item.cat=='skin') cfg.eqSkin = item.id;
    if(item.cat=='color') cfg.eqColor = item.id;
    if(item.cat=='fx') cfg.eqFx = item.id;
    save(); renderShop();
   };
  } else {
   b.textContent = T().buy;
   b.onclick = ()=>{
    if((cfg.coins||0) >= item.cost){
     cfg.coins -= item.cost;
     cfg.inv.push(item.id);
     if(item.cat=='skin') cfg.eqSkin = item.id;
     if(item.cat=='color') cfg.eqColor = item.id;
     if(item.cat=='fx') cfg.eqFx = item.id;
     save(); apply(); renderShop();
    }
   };
  }
  d.appendChild(b);
  l.appendChild(d);
 });
}

let ac;function beep(f){if(!cfg.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime;o.frequency.value=f;v.gain.setValueAtTime(.05,n);v.gain.exponentialRampToValueAtTime(.001,n+.12);o.connect(v);v.connect(ac.destination);o.start();o.stop(n+.12)}catch(e){}}

const ax=10,ay=50,aw=W-20,ah=H-60,R0=28,SK=['dash','wave','heavy','shield','giant','magnet','swap','bolt'];
let mode,playerCount=2,B=[],fx=[],run=false,spd=1,C={},stick={},keys={};
let COL=['#3d7bff','#ff3d7f','#2ecc71','#e67e22'];

function updateColors(){
 if(cfg.eqColor=='color_gold') COL=['#ffd700','#2ecc71','#3498db','#e74c3c'];
 else if(cfg.eqColor=='color_purple') COL=['#9b59b6','#e67e22','#1abc9c','#f1c40f'];
 else COL=['#3d7bff','#ff3d7f','#2ecc71','#e67e22'];
}

function startMulti(p){playerCount=p;start('multi');}

function mk(i,bot){
 const hp=100;
 const pos=[
  {x:180, y:ay+ah/2},
  {x:W-180, y:ay+ah/2},
  {x:W/2, y:ay+60},
  {x:W/2, y:ay+ah-60}
 ];
 return{i,bot,x:pos[i%4].x,y:pos[i%4].y,vx:0,vy:0,r:R0,m:1,hp,mx:hp,sk:pickSk(),cd:0,heavy:0,giant:0,shield:0,magnet:0,frz:0,hit:0,clockSlow:0,clockDmg:0,dx:0,dy:0,mag:0,ait:0}
}

function start(m){
 mode=m;updateColors();const cs=getComputedStyle(document.documentElement);
 C={fg:cs.getPropertyValue('--fg').trim(),pn:cs.getPropertyValue('--pn').trim(),ln:cs.getPropertyValue('--ln').trim(),bg:cs.getPropertyValue('--bg').trim()};
 
 const count = (m==='multi') ? playerCount : 2;
 B=[];
 for(let i=0; i<count; i++){
  B.push(mk(i, m==='bots' || (m==='bot' && i===1)));
 }
 
 fx=[];stick={};spd=1;ph=m==='bots'?'fight':'pick';
 PK=B.map(()=>({o:[mkO(),mkO(),mkO()],c:-1,rr:false,aim:null,rd:false}));
 
 if(m==='bot'||m==='online'){
  const q=PK[1],k=Math.random()*3|0,o=q.o[k];q.c=k;q.rr=q.rd=true;B[1].hp=B[1].mx=o.hp;B[1].sk=o.sk;q.aim=Math.PI+(Math.random()-.5)*.8;
 }
 if(m==='bots'){B[0].vx=420;B[1].vx=-420;}else renderPk();
 
 $('#spd').textContent='x1';$('#spd').style.display=m==='bots'?'':'none';
 $('#paus').textContent='⏸️';$('#rew').textContent='';
 ['menu','set','res','shop','online-match','pselect'].forEach(k=>$('#'+k).classList.add('hide'));
 $('#bar').classList.remove('hide');run=true;
}

function togglePause(){
 run=!run;
 $('#paus').textContent=run?'⏸️':'▶️';
}

const nm=i=>{
 const pNames=[T().p1, T().p2, T().p3, T().p4];
 if(mode==='bot' && i===1) return T().bot;
 if(mode==='bots') return T().bot+' '+(i+1);
 return pNames[i]||('P'+(i+1));
};

function ring(s,c){fx.push({x:s.x,y:s.y,t:0,c})}
function use(s,o){if(!run||s.cd>0||!o)return;const K=SKD[s.sk],P=K?K.power||1:1,Cd=K?K.cd||6:6;s.cd=Cd;beep(600);
 const d=Math.hypot(o.x-s.x,o.y-s.y)||1,ux=(o.x-s.x)/d,uy=(o.y-s.y)/d;
 switch(K?K.base:s.sk){
  case'dash':{const x=ux,y=uy;s.vx+=x*750*(P/10);s.vy+=y*750*(P/10);break}
  case'wave':if(d<240){o.vx+=ux*700*(P/10)/o.m;o.vy+=uy*700*(P/10)/o.m}ring(s,'#ffd23f');break;
  case'heavy':s.heavy=3.5;break;
  case'shield':s.shield=5;break;
  case'giant':s.giant=4;break;
  case'magnet':s.magnet=2.5;break;
  case'swap':[s.x,o.x]=[o.x,s.x];[s.y,o.y]=[o.y,s.y];ring(s,'#b66dff');ring(o,'#b66dff');break;
  case'bolt':o.frz=1.3;o.vx*=.2;o.vy*=.2;ring(o,'#ffd23f');break;
  case'clockup':o.clockSlow=5.0;o.clockDmg=5.0;ring(o,'#00e5ff');break;
 }}

function dmg(s,v){
 if(s.hit>0)return;
 if(s.shield>0){s.shield=0;ring(s,'#fff');return}
 let rdmg=1+Math.random()*4;
 if(s.clockDmg>0){ rdmg *= 0.7; }
 s.hp-=rdmg;s.hit=.2;
}

const KM=[[['a','arrowleft'],['d','arrowright'],['w','arrowup'],['s','arrowdown']],[['arrowleft'],['arrowright'],['arrowup'],['arrowdown']]];
const kd=(i,j)=>KM[i]&&KM[i][j]?KM[i][j].some((k,n)=>keys[k]&&(i||n==0||mode==='bot'))?1:0:0;

function upd(dt){
 const alive = B.filter(s=>s.hp>0);
 for(const s of B){
  if(s.hp<=0) continue;
  const o = alive.find(x=>x!==s) || B[0];
  const df=cfg.diff;
  if(s.bot){s.ait-=dt;
   if(s.ait<=0){s.ait=[.5,.3,.15][df];const an=Math.atan2(o.y-s.y,o.x-s.x)+(Math.random()-.5)*[1.6,.8,.2][df];s.dx=Math.cos(an);s.dy=Math.sin(an);s.mag=[.65,.85,1][df]}
   if(s.cd<=0&&Math.hypot(o.x-s.x,o.y-s.y)<300&&Math.random()<[.01,.03,.08][df])use(s,o)}
  else if(s.cd<=0&&Math.hypot(o.x-s.x,o.y-s.y)<300)use(s,o);
  for(const k of['heavy','giant','shield','magnet','frz','hit','cd','clockSlow','clockDmg'])s[k]=Math.max(0,s[k]-dt);
  s.r=R0*(s.giant>0?1.6:1);s.m=(s.heavy>0?3:1)*(s.giant>0?2.5:1);
  
  if(s.magnet>0){const d=Math.max(1,Math.hypot(s.x-o.x,s.y-o.y));o.vx+=(s.x-o.x)/d*700*dt;o.vy+=(s.y-o.y)/d*700*dt}}
 
 for(const s of B){
  if(s.hp<=0) continue;
  let f=Math.exp(-.12*dt);
  if(s.clockSlow>0){ f*=0.5; }
  const sp=Math.hypot(s.vx,s.vy);s.vx*=f;s.vy*=f;
  if(sp>650){s.vx*=650/sp;s.vy*=650/sp}if(sp<230&&sp>1&&s.frz<=0){s.vx*=230/sp;s.vy*=230/sp}
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(s.x-s.r<ax){s.x=ax+s.r;s.vx=Math.abs(s.vx)*.9}if(s.x+s.r>ax+aw){s.x=ax+aw-s.r;s.vx=-Math.abs(s.vx)*.9}
  if(s.y-s.r<ay){s.y=ay+s.r;s.vy=Math.abs(s.vy)*.9}if(s.y+s.r>ay+ah){s.y=ay+ah-s.r;s.vy=-Math.abs(s.vy)*.9}
 }

 for(let i=0; i<B.length; i++){
  for(let j=i+1; j<B.length; j++){
   const a=B[i], b=B[j];
   if(a.hp<=0 || b.hp<=0) continue;
   const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,mn=a.r+b.r;
   if(d<mn){
    const nx=dx/d,ny=dy/d,ov=mn-d,t=a.m+b.m;
    a.x-=nx*ov*b.m/t;a.y-=ny*ov*b.m/t;b.x+=nx*ov*a.m/t;b.y+=ny*ov*a.m/t;
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rv<0){
     const jVal=-1.2*rv/(1/a.m+1/b.m);a.vx-=jVal/a.m*nx;a.vy-=jVal/a.m*ny;b.vx+=jVal/b.m*nx;b.vy+=jVal/b.m*ny;
     const sp=-rv;if(sp>80){dmg(a,(sp-80)*.015*b.m);dmg(b,(sp-80)*.015*a.m);beep(120+sp/3)}
    }
   }
  }
 }
 fx.forEach(f=>f.t+=dt);fx=fx.filter(f=>f.t<.4);
 
 if(alive.length<=1 && B.length>1){
  const w=alive[0]||B[0];
  show('res');
  $('#rt').textContent=nm(w.i)+' '+T().win;
  if(w.i===0 && mode!=='bots'){
   const earned = Math.max(1, Math.min(10, Math.ceil(w.hp / 10)));
   cfg.coins = (cfg.coins || 0) + earned;
   save(); apply();
   $('#rew').textContent = `+${earned} 🪙 Coins!`;
  }
 }
}

const FN=" 'Noto Sans Thai',Sarabun,system-ui,sans-serif";
function draw(){g.fillStyle=C.bg||'#12141f';g.fillRect(0,0,W,H);
 g.fillStyle=C.pn||'#1c2033';g.strokeStyle=C.ln||'#363c5c';g.lineWidth=4;g.beginPath();g.roundRect(ax,ay,aw,ah,18);g.fill();g.stroke();
 if(!B.length)return;
 for(const f of fx){g.strokeStyle=f.c;g.globalAlpha=1-f.t/.4;g.lineWidth=5;g.beginPath();g.arc(f.x,f.y,f.t*550,0,7);g.stroke()}g.globalAlpha=1;
 for(const s of B){
  if(s.hp<=0) continue;
  g.fillStyle=COL[s.i%COL.length];g.globalAlpha=s.frz>0?.5:1;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();g.globalAlpha=1;
  if(s.hit>0){g.fillStyle='rgba(255,255,255,.55)';g.fill()}
  g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.arc(s.x-s.r*.3,s.y-s.r*.3,s.r*.3,0,7);g.fill();
  if(s.shield>0){g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.arc(s.x,s.y,s.r+6,0,7);g.stroke()}
  if(s.heavy>0){g.strokeStyle=C.fg;g.lineWidth=6;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.stroke()}
  if(s.magnet>0){g.strokeStyle='#b66dff';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.arc(s.x,s.y,s.r+12,0,7);g.stroke();g.setLineDash([])}
  if(s.clockSlow>0){g.strokeStyle='#00e5ff';g.lineWidth=4;g.beginPath();g.arc(s.x,s.y,s.r+8,0,7);g.stroke();}
  
  if(ph!='fight')continue;
  const barW = Math.min(180, (W-40)/B.length);
  const bx = 10 + s.i * (barW + 10);
  g.fillStyle=C.ln;g.fillRect(bx,10,barW,12);g.fillStyle=COL[s.i%COL.length];g.fillRect(bx,10,barW*Math.max(0,s.hp/s.mx),12);
  g.fillStyle=C.fg;g.font='700 11px'+FN;g.textAlign='left';
  g.fillText(nm(s.i)+' : '+Math.max(0,Math.ceil(s.hp)),bx,36);
 }
 g.textAlign='center';
 for(let i=0; i<B.length; i++){
  if(mode==='bots'||(i>0&&mode==='bot'))continue;
  const s=B[i]; if(s.hp<=0) continue;
  const x=60 + i*100, y=340;
  g.fillStyle=C.pn;g.globalAlpha=.92;g.beginPath();g.arc(x,y,28,0,7);g.fill();g.globalAlpha=1;
  if(s.cd>0){g.fillStyle=COL[i%COL.length];g.globalAlpha=.35;g.beginPath();g.moveTo(x,y);g.arc(x,y,28,-1.57,-1.57+6.283*Math.min(1,s.cd/6));g.fill();g.globalAlpha=1}
  g.strokeStyle=COL[i%COL.length];g.lineWidth=3;g.beginPath();g.arc(x,y,28,0,7);g.stroke();
  g.fillStyle=C.fg;g.font='700 10px'+FN;g.fillText(skn(s.sk),x,y+3)
 }
 for(const k in stick){const st=stick[k],dx=st.x-st.sx,dy=st.y-st.sy,l=Math.min(60,Math.hypot(dx,dy)),an=Math.atan2(dy,dx);
  g.strokeStyle=C.ln;g.lineWidth=3;g.beginPath();g.arc(st.sx,st.sy,60,0,7);g.stroke();
  g.fillStyle=COL[k%COL.length];g.globalAlpha=.7;g.beginPath();g.arc(st.sx+Math.cos(an)*l,st.sy+Math.sin(an)*l,22,0,7);g.fill();g.globalAlpha=1}}

const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{if(!run)return;const[x,y]=pt(e);
 if(ph!='fight'){
  const p=mode==='multi'?(x<W/2?0:1):mode==='bot'?0:-1;
  if(p>=0&&PK[p]&&PK[p].c>=0&&!PK[p].rd){PK[p].aim=Math.atan2(y-B[p].y,x-B[p].x);drag=p;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
  return;
 }
 for(let i=0; i<B.length; i++){
  if(mode==='bots'||(i>0&&mode==='bot'))continue;
  if(Math.hypot(x-(60+i*100),y-340)<35){
   const enemy = B.find(o=>o!==B[i] && o.hp>0) || B[0];
   use(B[i], enemy); return;
  }
 }
 const p=mode==='multi'?(x<W/2?0:1):mode==='bot'?0:-1;if(p<0||stick[p])return;
 stick[p]={id:e.pointerId,sx:x,sy:y,x,y};try{cv.setPointerCapture(e.pointerId)}catch(_){}});

cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(ph!='fight'){if(drag>=0&&PK[drag])PK[drag].aim=Math.atan2(y-B[drag].y,x-B[drag].x);return}for(const k in stick)if(stick[k].id==e.pointerId){stick[k].x=x;stick[k].y=y}});
const rel=e=>{drag=-1;for(const k in stick)if(stick[k].id==e.pointerId)delete stick[k]};
cv.addEventListener('pointerup',rel);cv.addEventListener('pointercancel',rel);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k.startsWith('arrow')||k==' ')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});

let last=0;
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(run&&ph==='fight')for(let k=0;k<spd;k++)if(run)upd(dt);draw();drawAim();requestAnimationFrame(loop)}

// ---- mods ----
const BUILTIN=[
 {id:'ex-skills',name:'Example Skills',ver:'1.0',author:'Ball Battle',desc:'Mega Dash + Mini Wave',skills:[{id:'megadash',name:{en:'Mega Dash',th:'พุ่งสุดแรง'},base:'dash',power:20,cd:180},{id:'minwave',name:{en:'Mini Wave',th:'คลื่นเล็ก'},base:'wave',power:5,cd:60}]},
 {id:'ex-theme',name:'Neon Theme',ver:'1.0',author:'Ball Battle',desc:'Neon colors',theme:{p1:'#00e5ff',p2:'#ff2bd6',ac:'#ff2bd6'}}];
const BASES=['dash','wave','heavy','shield','giant','magnet','swap','bolt'];
let mods=[],SKD={},mus=true,mt=null,mi=0;
function loadMods(){let st={};try{st=JSON.parse(localStorage.getItem('bbm')||'{}')}catch(e){}
 mods=BUILTIN.map(m=>({...m,on:!!(st.on&&st.on[m.id]),builtin:1})).concat(st.user||[])}
function saveMods(){try{localStorage.setItem('bbm',JSON.stringify({on:Object.fromEntries(mods.map(m=>[m.id,m.on])),user:mods.filter(m=>!m.builtin)}))}catch(e){}}
function applyMods(){SKD={};const r=document.documentElement.style;r.removeProperty('--ac');COL=['#3d7bff','#ff3d7f','#2ecc71','#e67e22'];
 for(const m of mods)if(m.on){(m.skills||[]).forEach(s=>{
  s.power=Math.max(1,Math.min(30,+s.power||10));
  s.cd=50+((s.power-1)/29)*(270-50);
  SKD[s.id]=s;
 });
  if(m.theme){if(m.theme.p1)COL[0]=m.theme.p1;if(m.theme.p2)COL[1]=m.theme.p2;if(m.theme.ac)r.setProperty('--ac',m.theme.ac)}}}

function pickSk(){
 let pool = BASES.slice();
 if(cfg.unlockedSkills && cfg.unlockedSkills.includes('clockup')){ pool.push('clockup'); }
 const modKeys = Object.keys(SKD);
 if(modKeys.length) pool = pool.concat(modKeys);
 return pool[Math.random()*pool.length|0];
}

function skn(id){const k=SKD[id];return k?((k.name&&(k.name[cfg.lang]||k.name.en))||id):T().sk[id]}
function mkEl(t,x,c){const e=document.createElement(t);e.textContent=x;if(c)e.className=c;return e}
function renderMods(){const l=$('#ml');l.textContent='';
 for(const m of mods){const d=mkEl('div','','mod'),t=mkEl('div',m.name+' v'+m.ver);
  t.appendChild(mkEl('small',T().by+' '+m.author+' · '+m.desc));d.appendChild(t);
  const b=mkEl('button',m.on?T().on:T().off,m.on?'on':'');
  b.onclick=()=>{m.on=!m.on;saveMods();applyMods();renderMods()};d.appendChild(b);
  if(!m.builtin){const x=mkEl('button','✕');x.onclick=()=>{mods=mods.filter(y=>y!=m);saveMods();applyMods();renderMods()};d.appendChild(x)}
  l.appendChild(d)}
 $('#mus').textContent=T()[mus?'mon':'moff']}
function openMods(){$('#mm').textContent='';show('mods');renderMods();music()}
async function impMod(f){const mm=$('#mm');mm.textContent='';if(!f)return;
 try{const z=await JSZip.loadAsync(f),j=async n=>JSON.parse(await z.file(n).async('string'));
  const m=await j('mod.json'),id='u-'+String(m.id||m.name).toLowerCase().replace(/\W+/g,'-');
  const o={id,name:String(m.name).slice(0,40),ver:String(m.ver||'1').slice(0,10),author:String(m.author||'?').slice(0,40),desc:String(m.desc||'').slice(0,100),on:true,skills:[]};
  for(const n of Object.keys(z.files).filter(n=>/^skills\/.+\.json$/.test(n))){const s=await j(n);
   if(!BASES.includes(s.base))continue;
   let p=Math.max(1,Math.min(30,+s.power||10));
   let cd=50+((p-1)/29)*(270-50);
   o.skills.push({id:id+'-'+String(s.id||o.skills.length),name:{en:String((s.name||{}).en||s.id||'?').slice(0,16),th:String((s.name||{}).th||(s.name||{}).en||s.id||'?').slice(0,16)},base:s.base,power:p,cd:cd})}
  if(z.file('ui/theme.json')){const t=await j('ui/theme.json'),ok=v=>/^#[0-9a-f]{6}$/i.test(v)?v:null;o.theme={p1:ok(t.p1),p2:ok(t.p2),ac:ok(t.ac)}}
  mods=mods.filter(x=>x.id!=id).concat(o);saveMods();applyMods();renderMods()}
 catch(e){mm.textContent=T().bad}}
function stopMus(){clearInterval(mt);mt=null}
function music(){stopMus();$('#mus').textContent=T()[mus?'mon':'moff'];if(!mus||!cfg.snd)return;
 try{ac=ac||new AudioContext();ac.resume&&ac.resume()}catch(e){return}
 const CH=[[48,55,59,64],[45,52,60,64],[41,48,57,64],[43,50,59,62]],P=[60,62,64,67,69,72],hz=n=>440*2**((n-69)/12);
 const note=(n,t,d,v,ty)=>{const o=ac.createOscillator(),g2=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;o.type=ty;o.frequency.value=hz(n);
  g2.gain.setValueAtTime(.0001,t);g2.gain.linearRampToValueAtTime(v,t+.08);g2.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g2);g2.connect(ac.destination);o.start(t);o.stop(t+d+.05)};
 const bar=()=>{const t=ac.currentTime+.05;CH[mi++%4].forEach(n=>note(n,t,3.2,.03,'sine'));
  for(let k=0;k<4;k++)if(Math.random()<.75)note(P[Math.random()*P.length|0]+12*(k%2),t+k*.8,1.4,.025,'triangle')};
 bar();mt=setInterval(bar,3200)}
let ph='fight',PK=[],drag=-1;

function mkO(){return{hp:100,sk:pickSk()}}

function renderPk(){const p=$('#pk');p.textContent='';p.style.display=ph==='fight'?'none':'flex';
 for(let i=0; i<B.length; i++){
  if(i>0 && (mode==='bot'||mode==='online')) continue;
  const q=PK[i]; if(!q) continue;
  const d=mkEl('div','','pp');d.style.borderColor=COL[i%COL.length];d.appendChild(mkEl('b',nm(i)));
  if(q.c<0){q.o.forEach((o,k)=>{const b=mkEl('button',skn(o.sk)+' · '+o.hp);b.onclick=()=>{q.c=k;q.aim=i?Math.PI:0;const s=B[i];s.hp=s.mx=o.hp;s.sk=o.sk;renderPk()};d.appendChild(b)});
   if(!q.rr){const b=mkEl('button','↻ '+T().rr);b.onclick=()=>{q.rr=true;q.o=[mkO(),mkO(),mkO()];renderPk()};d.appendChild(b)}}
  else if(!q.rd){d.appendChild(mkEl('small',T().aim));const b=mkEl('button',T().rdy,'on');b.onclick=()=>{q.rd=true;renderPk();chk()};d.appendChild(b)}
  else d.appendChild(mkEl('small','✓'));
  p.appendChild(d);
 }
}
function chk(){if(!PK.every(q=>q.rd))return;
 B.forEach((s,i)=>{
  const enemy = B.find(o=>o!==s) || B[0];
  const a=PK[i]&&PK[i].aim!=null?PK[i].aim:Math.atan2(enemy.y-s.y,enemy.x-s.x);
  s.vx=Math.cos(a)*420;s.vy=Math.sin(a)*420
 });
 ph='fight';renderPk()}
function drawAim(){if(ph==='fight'||!run)return;
 PK.forEach((q,i)=>{if(!q||q.aim==null||q.c<0||!B[i])return;const s=B[i],a=q.aim,L=70,x=s.x+Math.cos(a)*(s.r+8),y=s.y+Math.sin(a)*(s.r+8),ex=x+Math.cos(a)*L,ey=y+Math.sin(a)*L;
  g.strokeStyle=g.fillStyle=COL[i%COL.length];g.lineWidth=5;g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.stroke();
  g.beginPath();g.moveTo(ex+Math.cos(a)*14,ey+Math.sin(a)*14);g.lineTo(ex+Math.cos(a+2.5)*14,ey+Math.sin(a+2.5)*14);g.lineTo(ex+Math.cos(a-2.5)*14,ey+Math.sin(a-2.5)*14);g.fill()})}
loadMods();applyMods();
apply();show('menu');requestAnimationFrame(loop);
